server:
  port: 8083

spring:
  application:
    name: ContactWork
  ai:
    model:
      embedding: google-genai
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: ${LOCAL_AI_MODEL:gemma4:e2b}
          keep_alive: 30m
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          options:
            model: ${GOOGLE_GENAI_MODEL:gemini-2.0-flash}
            temperature: ${GOOGLE_GENAI_TEMPERATURE:0.2}
        embedding:
          text:
            options:
              model: text-embedding-004
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://postgres:5432/contactwork
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  ai:
    brave:
      api-key: ${BRAVE_SEARCH_API_KEY:}
      web-search-url: https://api.search.brave.com/res/v1/web/search
      count: 5
  resources:
    working-dir: /tmp/contactwork/generated
  onlyoffice:
    public-base-url: ${ONLYOFFICE_PUBLIC_BASE_URL:http://127.0.0.1:8084}
    document-base-url: ${ONLYOFFICE_DOCUMENT_BASE_URL:http://app:8083}
    internal-download-base-url: ${ONLYOFFICE_INTERNAL_DOWNLOAD_BASE_URL:http://onlyoffice}
    converter-base-url: ${ONLYOFFICE_CONVERTER_BASE_URL:http://onlyoffice}
    access-secret: ${ONLYOFFICE_ACCESS_SECRET:dev-onlyoffice-secret}
  mail:
    send-delay-ms: 3000
    inbox-sync-cron: "0 */30 * * * *"
    brevo:
      api-key: ${BREVO_API_KEY:}
    gmail:
      inbox-folder: ${GMAIL_INBOX_FOLDER:INBOX}
      sent-folder: ${GMAIL_SENT_FOLDER:[Gmail]/Sent Mail}
      spam-folder: ${GMAIL_SPAM_FOLDER:[Gmail]/Spam}
      oauth:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:}
